name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装字体（引擎需要真实字体才能跑集成测试）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-noto-cjk fontconfig

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 检查依赖为零
        run: python -c "import typesmith; print(typesmith.__version__)"

      - name: 单元测试
        run: python run_tests.py -v

      - name: 生成示例图（冒烟）
        run: python run_demos.py
